<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4D45C6" />
    <meta name="description" content="Keep the important parts of your life warm." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ember" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Ember</title>
    <style>
      html, body { margin: 0; background: #3F38B4; }
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #3F38B4; color: #fff; font-family: 'Inter Tight', system-ui, sans-serif; transition: opacity .5s ease, transform .5s ease; overflow: hidden; }
      #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      .sp-glow { position: absolute; width: 520px; height: 520px; max-width: 150vw; border-radius: 50%; background: #4D45C6; top: 50%; left: 50%; margin: -300px 0 0 -260px; animation: sp-breathe 3.2s ease-in-out infinite; }
      .sp-art { position: relative; overflow: visible; animation: sp-rise .9s cubic-bezier(.2, .8, .2, 1) both; }
      .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-flicker 1.5s ease-in-out infinite; }
      .fl1 { animation-duration: 1.1s; animation-delay: -.3s; }
      .fl2 { animation-duration: 0.9s; animation-delay: -.6s; }
      .fl3 { animation-duration: 0.75s; animation-delay: -.2s; }
      .sp-spark { transform-box: fill-box; opacity: 0; animation: sp-spark 2.4s ease-out infinite; }
      .s2 { animation-delay: .5s; } .s3 { animation-delay: 1s; } .s4 { animation-delay: 1.5s; } .s5 { animation-delay: 1.9s; }
      .sp-title { position: relative; margin: 10px 0 0; font-size: 44px; font-weight: 800; letter-spacing: -.04em; animation: sp-fade .8s .35s ease both; }
      .sp-sub { position: relative; margin: 0; font-size: 16px; font-weight: 500; color: #CFC9F7; animation: sp-fade .8s .6s ease both; }
      @keyframes sp-flicker { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 25% { transform: scale(.97, 1.05) skewX(1.5deg); } 50% { transform: scale(1.02, .96) skewX(-1.2deg); } 75% { transform: scale(.98, 1.04) skewX(.8deg); } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(26px) scale(.92); } to { opacity: 1; transform: none; } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-spark { 0% { opacity: 0; transform: translateY(40px) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-110px) translateX(14px) scale(.2); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; } .sp-spark { display: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Opening Ember">
      <div class="sp-glow"></div>
      <svg class="sp-art" viewBox="0 0 512 512" width="220" height="220" aria-hidden="true">
        <g class="sp-flames"><g class="fl fl0"><path fill="#E8553A" d="M256 58C268 112 312 148 338 196C366 246 372 300 346 342C326 374 292 392 256 392C220 392 186 374 166 342C140 300 146 248 174 204C190 178 206 166 214 140C220 160 230 168 240 168C236 130 244 92 256 58Z"/></g><g class="fl fl1"><path fill="#FF9A2E" d="M256 128C262 166 296 194 314 228C332 262 334 300 316 330C302 354 280 368 256 368C232 368 210 354 196 330C178 300 180 262 198 230C208 212 220 202 226 184C232 196 238 200 246 200C244 176 248 152 256 128Z"/></g><g class="fl fl2"><path fill="#FFD25A" d="M256 196C260 224 282 244 292 266C302 288 300 312 288 330C278 346 268 354 256 354C244 354 234 346 224 330C212 312 210 288 220 266C228 250 240 238 246 224C250 230 254 232 258 232C256 220 255 208 256 196Z"/></g><g class="fl fl3"><path fill="#FFF1B0" d="M256 264C260 280 272 290 276 304C280 318 272 336 256 340C240 336 232 318 236 304C240 290 252 280 256 264Z"/></g></g>
        <!-- logs -->
    <g transform="rotate(-14 256 392)"><rect x="96" y="372" width="320" height="46" rx="23" fill="#7A4A2A"/><ellipse cx="108" cy="395" rx="14" ry="22" fill="#C98B55"/><ellipse cx="404" cy="395" rx="14" ry="22" fill="#C98B55"/></g>
    <g transform="rotate(14 256 392)"><rect x="96" y="372" width="320" height="46" rx="23" fill="#5C3720"/><ellipse cx="108" cy="395" rx="14" ry="22" fill="#B87A48"/><ellipse cx="404" cy="395" rx="14" ry="22" fill="#B87A48"/></g>
    <!-- stones -->
    <g>
      <ellipse cx="116" cy="418" rx="44" ry="30" fill="#8F87DC"/><ellipse cx="396" cy="418" rx="44" ry="30" fill="#8F87DC"/>
      <ellipse cx="170" cy="446" rx="46" ry="30" fill="#B9B2F0"/><ellipse cx="342" cy="446" rx="46" ry="30" fill="#B9B2F0"/>
      <ellipse cx="256" cy="458" rx="54" ry="32" fill="#9E96E6"/>
    </g>
        <circle class="sp-spark s1" cx="226" cy="150" r="7" fill="#FFD25A"/>
        <circle class="sp-spark s2" cx="296" cy="170" r="6" fill="#FF9A2E"/>
        <circle class="sp-spark s3" cx="262" cy="120" r="5" fill="#FFF1B0"/>
        <circle class="sp-spark s4" cx="204" cy="190" r="5" fill="#FF9A2E"/>
        <circle class="sp-spark s5" cx="318" cy="210" r="6" fill="#FFD25A"/>
      </svg>
      <h1 class="sp-title">Ember</h1>
      <p class="sp-sub">Keep it warm</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
